services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem0-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: mem0-ollama
    restart: unless-stopped
    ports:
      - "0.0.0.0:11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama

  mem0-api:
    build: ./server
    container_name: mem0-api
    restart: unless-stopped
    depends_on:
      - qdrant
      - ollama
    ports:
      - "0.0.0.0:8090:8090"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      TZ: America/Sao_Paulo
      LLM_MODEL: llama3.2:3b
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      COLLECTION: obsidian
      DEFAULT_USER: obsidian
      MEM0_TELEMETRY: "False"
      EMBED_BASE_URL: http://127.0.0.1:8091/v1
      EMBED_MODEL: text-embedding-3-small
      EMBED_API_KEY: local-proxy
      EMBED_DIMS: "768"
      OPENAI_EMBED_MODEL: text-embedding-3-small
      GEMINI_EMBED_MODEL: gemini-embedding-001
      CHUNK_MAX_CHARS: "900"
      CHUNK_OVERLAP: "150"
    volumes:
      - ${VAULT_PATH:-/home/user/Obsidian}:/vault:ro
      - ${VAULT_MEM0_PATH:-./vault-mem0}:/vault-mem0:rw
      - ./server:/app
      - ./data/state:/state
